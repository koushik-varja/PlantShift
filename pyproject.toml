[project]
name = "plantshift"
version = "1.1.0"
description = "Brownfield Smart-Factory Transformation Twin"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "paho-mqtt==2.1.0",
  "psycopg[binary]==3.2.10",
  "psutil==7.2.2",
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.14.1", "mypy==1.18.2"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 140
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
